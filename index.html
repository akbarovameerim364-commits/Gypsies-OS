<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Розовый планировщик</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Слой для падающих сердечек -->
  <div class="sky" id="sky"></div>

  <div class="page">

    <!-- Кукла и облачко -->
    <div class="doll-zone">
      <div class="doll" id="doll">
        <div class="hair-back"></div>
        <div class="face">
          <div class="bangs"></div>
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="smile"></div>
        </div>
        <div class="bow">🎀</div>
        <div class="dress"></div>
      </div>
      <p class="bubble" id="bubble">Привет, красотка! Добавь процессы и нажми «Запустить»!</p>
    </div>

    <!-- Друзья -->
    <div class="friends">
      <div class="doll friend brunette">
        <div class="hair-back"></div>
        <div class="face">
          <div class="bangs"></div>
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="smile"></div>
        </div>
        <div class="bow">🌸</div>
        <div class="dress"></div>
      </div>
      <span class="pet">🐶</span>
      <span class="pet">🦄</span>
      <span class="pet">🐱</span>
    </div>

    <!-- Форма -->
    <div class="card">
      <h1>Round Robin</h1>

      <label for="quantum">Квант времени</label>
      <input type="number" id="quantum" min="1" value="2">

      <h2>Процессы</h2>
      <div id="rows"></div>

      <div class="buttons">
        <button class="btn-add" id="addBtn" type="button">+ Добавить процесс</button>
        <button class="btn-run" id="runBtn" type="button">Запустить</button>
      </div>

      <!-- Результаты -->
      <div id="result" class="hidden">
        <h2>Результаты</h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Процесс</th>
                <th>AT<br>приход</th>
                <th>BT<br>выполнение</th>
                <th>ST<br>старт</th>
                <th>CT<br>завершение</th>
                <th>TAT<br>оборот</th>
                <th>WT<br>ожидание</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>

        <div class="averages">
          <div class="avg-box">Среднее WT: <b id="avgWT">0</b></div>
          <div class="avg-box">Среднее TAT: <b id="avgTAT">0</b></div>
        </div>

        <h2>Диаграмма Ганта</h2>
        <div class="gantt" id="gantt"></div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
